version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      lobe-icons:
        patterns: ['@lobehub/icons-static-svg']
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: cargo
    directory: /sdk/rust
    schedule: {interval: weekly}
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule: {interval: weekly}
