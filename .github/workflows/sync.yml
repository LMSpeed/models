name: Synchronize model specifications
on:
  repository_dispatch:
    types: [model-specs-published]
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
    inputs:
      check_coverage:
        type: boolean
        default: false
        description: Inspect upstream coverage even if the source revision is unchanged
  workflow_call:
    inputs:
      check_coverage:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: model-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {token: '${{ github.token }}', fetch-depth: 0}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.5', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - id: sync
        run: pnpm sync && pnpm validate
        env:
          CHECK_UPSTREAM_COVERAGE: ${{ inputs.check_coverage && '1' || '0' }}
      - name: Propose a validated data revision
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REQUIRED: ${{ steps.sync.outputs.review_required }}
        run: pnpm exec tsx scripts/sync-pr.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sync-check-${{ github.run_id }}
          path: .sync/last-success.json
          include-hidden-files: true
          retention-days: 30
