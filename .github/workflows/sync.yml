name: Synchronize model specifications
on:
  repository_dispatch:
    types: [model-specs-published]
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: model-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {token: '${{ github.token }}', fetch-depth: 0}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.5', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - id: sync
        run: pnpm sync && pnpm validate
      - name: Propose a validated data revision
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REQUIRED: ${{ steps.sync.outputs.review_required }}
        run: pnpm exec tsx scripts/sync-pr.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sync-check-${{ github.run_id }}
          path: .sync/last-success.json
          include-hidden-files: true
          retention-days: 30
