name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  continue-automation:
    needs: required
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/automation/')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - name: Continue from the trusted default branch after successful explicit validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
        run: gh workflow run merge-validated.yml --ref main -f validation_run_id="$VALIDATION_RUN_ID"
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      sdk: ${{ steps.scope.outputs.sdk }}
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22.23.5', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - id: scope
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec tsx scripts/ci-scope.ts
  data-and-build:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22.23.5', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-docs.ts && pnpm exec tsx scripts/check-tests.ts
      - run: pnpm exec tsx scripts/check-changes.ts
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: needs.scope.outputs.docs_only != 'true'
        run: pnpm exec biome check . && pnpm typecheck && pnpm test && pnpm validate
      - if: needs.scope.outputs.build == 'true'
        run: pnpm --filter @lmspeed/models-site typecheck && pnpm build && pnpm exec tsx scripts/validate-artifacts.ts
      - if: needs.scope.outputs.build == 'true'
        run: pnpm exec playwright install --with-deps chromium && pnpm exec playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: needs.scope.outputs.build == 'true'
        with:
          name: static-${{ github.sha }}
          path: apps/site/dist
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  sdk-contracts:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {language: javascript, node: '22.23.5'}
          - {language: javascript, node: '26.13.1'}
          - {language: python, python: '3.10'}
          - {language: python, python: '3.14.8'}
          - {language: rust, rust: '1.89.0'}
          - {language: rust, rust: '1.99.1'}
          - {language: go, go: '1.23.12'}
          - {language: go, go: '1.27.4'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '${{ matrix.node || ''22.23.5'' }}', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: matrix.language == 'python'
        with: {python-version: '${{ matrix.python }}'}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: matrix.language == 'python'
        with: {version: '0.12.9', enable-cache: true}
      - if: matrix.language == 'python'
        run: uv sync --project sdk/python --locked --python '${{ matrix.python }}'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        if: matrix.language == 'rust'
        with: {toolchain: '${{ matrix.rust }}'}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: matrix.language == 'go'
        with: {go-version: '${{ matrix.go }}', cache-dependency-path: sdk/go/go.sum}
      - if: matrix.language == 'rust' && matrix.rust == '1.99.1'
        run: rustup toolchain install nightly-2026-11-21 --profile minimal --component llvm-tools-preview && cargo install cargo-llvm-cov --version 0.9.2 --locked
      - run: pnpm build
      - run: pnpm exec tsx scripts/test-sdk.ts '${{ matrix.language }}'
        env:
          MODELS_RUST_COVERAGE: ${{ matrix.language == 'rust' && matrix.rust == '1.99.1' && '1' || '0' }}
  generated-contract:
    needs: scope
    if: needs.scope.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22.23.5', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with: {toolchain: '1.89.0', components: rustfmt}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: {go-version: '1.23.12'}
      - run: pnpm exec tsx scripts/generate-types.ts && pnpm exec tsx scripts/generate-fixtures.ts
      - run: git diff --exit-code -- fixtures sdk
  required:
    if: always()
    needs: [scope, data-and-build, sdk-contracts, generated-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>!["success","skipped"].includes(job.result))) process.exit(1)'
