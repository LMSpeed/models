name: Nightly regression and release recovery
on:
  schedule:
    - cron: '11 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  SDK_PUBLISH_ECOSYSTEMS: ${{ vars.SDK_PUBLISH_ECOSYSTEMS || 'npm,pypi,crates,go' }}
jobs:
  regression:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/validate.yml
  synchronize:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/sync.yml
    with:
      check_coverage: true
    secrets: inherit
  recover-releases:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.5', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/release/recover.ts
        env:
          GH_TOKEN: ${{ github.token }}
  inspect:
    needs: [regression, synchronize]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.5', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/nightly.ts
        env:
          GH_TOKEN: ${{ github.token }}
