name: Merge validated automation and continue delivery
on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Completed Validate run to inspect on its immutable head
        required: true
        type: string
  workflow_run:
    workflows: [Validate]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: merge-model-automation
  cancel-in-progress: false
jobs:
  merge:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: main, persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.5', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/merge-validated.ts
        env:
          GH_TOKEN: ${{ github.token }}
