name: Verify Alchemy GitHub deployment
on:
  push:
    branches: [main]
    paths: ['data/**', 'coverage/models-dev.json', 'logos/**', 'apps/site/**', 'packages/core/**', 'packages/publish/**', 'pnpm-lock.yaml', 'scripts/deploy.ts', 'scripts/deployment.ts', 'scripts/build-site.ts', 'alchemy.run.ts']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-static-production
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.5', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/watch-deployment.ts
        env:
          GH_TOKEN: ${{ github.token }}
