name: Release four SDKs
on:
  push:
    branches: [main]
    paths: ['.changes/**', 'release.json']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  SDK_PUBLISH_ECOSYSTEMS: ${{ vars.SDK_PUBLISH_ECOSYSTEMS || 'npm,pypi,crates,go' }}
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: sdk-publish
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {token: '${{ github.token }}', fetch-depth: 0}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.15.0', registry-url: 'https://registry.npmjs.org', cache: pnpm}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.12.9'}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with: {toolchain: '1.99.1'}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: {go-version: '1.27.4', cache-dependency-path: sdk/go/go.sum}
      - run: pnpm install --frozen-lockfile
      - id: control
        run: pnpm exec tsx scripts/release/control.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.control.outputs.mode == 'prepare'
        run: pnpm exec tsx scripts/release/prepare.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.control.outputs.mode == 'publish'
        name: Resume the immutable release commit
        env:
          RELEASE_COMMIT: ${{ steps.control.outputs.commit }}
        run: |
          git switch --detach "$RELEASE_COMMIT"
          pnpm install --frozen-lockfile
          pnpm exec tsx scripts/smoke.ts
      - if: steps.control.outputs.mode == 'publish' && contains(env.SDK_PUBLISH_ECOSYSTEMS, 'crates')
        id: crates-auth
        name: Obtain a short-lived crates.io publishing identity
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      - if: steps.control.outputs.mode == 'publish'
        name: Publish missing packages and verify actual public installations
        run: pnpm exec tsx scripts/release/publish.ts
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
